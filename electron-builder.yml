appId: com.splayer.taskbarlyric
productName: TaskbarLyric
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - logo.ico
  - from: native/smtc-lyric
    to: native
    filter:
      - smtc-lyric.node
win:
  target:
    - nsis
    - portable
  icon: resources/logo.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Taskbar Lyric
portable:
  artifactName: TaskbarLyric-${version}-portable.exe
